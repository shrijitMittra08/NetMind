name: C++ Tests

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Debug
        run: cmake -S . -B build/debug -DCMAKE_BUILD_TYPE=Debug

      - name: Build Debug
        run: cmake --build build/debug

      - name: Run C++ tests
        run: ctest --test-dir build/debug --output-on-failure

      - name: Configure Sanitizer
        run: cmake -S . -B build/sanitize -DCMAKE_BUILD_TYPE=Debug -DNETMIND_ENABLE_SANITIZERS=ON

      - name: Build Sanitizer
        run: cmake --build build/sanitize

      - name: Run Sanitizer tests
        run: ctest --test-dir build/sanitize --output-on-failure
